<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRIS Neural Interface v2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-layout">
        
        <div class="main-column">
            
            <div class="top-task-bar" id="task-circles">
                </div>

            <div class="center-stage">
                <div class="segmented-ring" id="iris-ring">
                    <div class="inner-core">
                        <h1 id="iris-text">IRIS</h1>
                    </div>
                </div>
                <div class="status-label" id="status-text">SYSTEM STANDBY</div>
            </div>

        </div>

        <div class="right-sidebar">
            
            <div class="sidebar-block time-block">
                <div class="time" id="clock">00:00 AM</div>
            </div>

            <div class="sidebar-block weather-block">
                <div class="weather-temp">☁️ 35°C</div>
                <div class="weather-loc">Chennai, TN</div>
            </div>

            <div class="sidebar-block task-list-block" id="task-list">
                <div class="empty-tasks">No Active Tasks</div>
            </div>

        </div>
    </div>

    <script>
        // 1. Generate the 12 circles dynamically
        const taskCirclesContainer = document.getElementById('task-circles');
        for(let i = 1; i <= 12; i++) {
            const circle = document.createElement('div');
            circle.className = 'task-circle';
            circle.id = `circle-${i}`;
            circle.textContent = i;
            taskCirclesContainer.appendChild(circle);
        }

        // 2. Real-Time Clock
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes().toString().padStart(2, '0');
            let ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            document.getElementById('clock').textContent = `${hours}:${minutes} ${ampm}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 3. Task UI Updater
        function updateTasks(taskCount) {
            const taskList = document.getElementById('task-list');
            taskList.innerHTML = ''; // Clear old list

            if (taskCount === 0) {
                taskList.innerHTML = '<div class="empty-tasks">No Active Tasks</div>';
            }

            // Update Circles and Sidebar List
            for(let i = 1; i <= 12; i++) {
                const circle = document.getElementById(`circle-${i}`);
                if (i <= taskCount) {
                    circle.classList.add('active');
                    
                    // Add to sidebar stack
                    const taskItem = document.createElement('div');
                    taskItem.className = 'task-item';
                    
                    // If it's the highest number, it's "Executing". Older ones are "Paused".
                    if (i === taskCount) {
                        taskItem.innerHTML = `<strong>Task ${i}</strong><br><span class="executing">Executing...</span>`;
                        taskItem.style.borderLeft = "4px solid #00ffaa";
                    } else {
                        taskItem.innerHTML = `<strong>Task ${i}</strong><br><span class="paused">Paused / Background</span>`;
                        taskItem.style.borderLeft = "4px solid #6c7a8c";
                    }
                    taskList.appendChild(taskItem);
                } else {
                    circle.classList.remove('active');
                }
            }
        }

        // 4. WebSocket Connection to Python Server
        const socket = new WebSocket('ws://127.0.0.1:8765');
        const irisRing = document.getElementById('iris-ring');
        const statusText = document.getElementById('status-text');
        const irisText = document.getElementById('iris-text');

        socket.onopen = function() {
            statusText.textContent = "CONNECTED";
        };

        socket.onmessage = function(event) {
            const data = JSON.parse(event.data);
            
            statusText.textContent = data.status;
            updateTasks(data.tasks);

            // Handle the Pop-up / Glow states
            irisRing.className = 'segmented-ring'; // Reset
            irisText.style.color = "#3b4b61";
            
            if (data.status === 'LISTENING') {
                irisRing.classList.add('listening');
                irisText.style.color = "#00ffaa";
            } else if (data.status === 'THINKING') {
                irisRing.classList.add('thinking');
                irisText.style.color = "#aa00ff";
            } else if (data.status === 'SPEAKING') {
                irisRing.classList.add('speaking'); // This triggers the Pop-Up scale!
                irisText.style.color = "#00aaff";
            } else if (data.status === 'VISION') {
                irisRing.classList.add('vision');
                irisText.style.color = "#ffaa00";
            }
        };

        socket.onclose = function() {
            statusText.textContent = "OFFLINE";
            updateTasks(0);
        };
    </script>
</body>
</html>
